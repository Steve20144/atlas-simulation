<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vectra banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jetb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- ten tilted fans: four pairs on the wings, two on the centreline -->
  <g transform="translate(880 150)">
    <path d="M-260 -70 L0 -30 L260 -70" fill="none" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="0" y1="-30" x2="0" y2="80" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="3"/>
    <g>
      <path d="M-248 -60 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(-16 -230 -66)"/>
      <path d="M-183 -50 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(-16 -165 -56)"/>
      <path d="M-118 -40 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(-16 -100 -46)"/>
      <path d="M-58 -30 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(-16 -40 -36)"/>
      <path d="M212 -60 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(16 230 -66)"/>
      <path d="M147 -50 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(16 165 -56)"/>
      <path d="M82 -40 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(16 100 -46)"/>
      <path d="M22 -30 l-18 60 l50 0 l-20 -60z" fill="url(#jet)" transform="rotate(16 40 -36)"/>
      <path d="M-10 26 l-14 50 l48 0 l-14 -50z" fill="url(#jetb)"/>
      <path d="M-10 76 l-14 50 l48 0 l-14 -50z" fill="url(#jetb)"/>
    </g>
    <g stroke="#e2e8f0" stroke-width="3" fill="#1e293b">
      <ellipse cx="-230" cy="-66" rx="22" ry="10" transform="rotate(-16 -230 -66)"/>
      <ellipse cx="-165" cy="-56" rx="22" ry="10" transform="rotate(-16 -165 -56)"/>
      <ellipse cx="-100" cy="-46" rx="22" ry="10" transform="rotate(-16 -100 -46)"/>
      <ellipse cx="-40" cy="-36" rx="22" ry="10" transform="rotate(-16 -40 -36)"/>
      <ellipse cx="230" cy="-66" rx="22" ry="10" transform="rotate(16 230 -66)"/>
      <ellipse cx="165" cy="-56" rx="22" ry="10" transform="rotate(16 165 -56)"/>
      <ellipse cx="100" cy="-46" rx="22" ry="10" transform="rotate(16 100 -46)"/>
      <ellipse cx="40" cy="-36" rx="22" ry="10" transform="rotate(16 40 -36)"/>
      <ellipse cx="0" cy="20" rx="22" ry="10"/>
      <ellipse cx="0" cy="70" rx="22" ry="10"/>
    </g>
  </g>

  <text x="70" y="118" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">Vectra</text>
  <text x="70" y="160" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Thrust-vector design studio for a 10-fan EDF aircraft</text>
  <text x="70" y="192" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Tilt every fan, read the cost on all six axes through a line-by-line replica of the PX4 v1.17.0</text>
  <text x="70" y="216" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">control allocator, then export parameters, Gazebo worlds and HITL runbooks.</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#0b1020" font-weight="600">
    <rect x="70" y="240" width="122" height="28" rx="14" fill="#f97316"/>
    <text x="131" y="259" text-anchor="middle">PX4 v1.17.0</text>
    <rect x="202" y="240" width="130" height="28" rx="14" fill="#22d3ee"/>
    <text x="267" y="259" text-anchor="middle">FastAPI + React</text>
    <rect x="342" y="240" width="150" height="28" rx="14" fill="#a3e635"/>
    <text x="417" y="259" text-anchor="middle">golden-log tested</text>
  </g>
</svg>
